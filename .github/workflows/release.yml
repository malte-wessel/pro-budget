name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions agree with the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version custom_components/pro_budget/manifest.json)" = "$TAG"
          test "$(jq -r .version package.json)" = "$TAG"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # v1.2.0-beta.1 → pre-release; HACS offers it only to users who enabled beta versions
          prerelease: ${{ contains(github.ref_name, '-') }}
